name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter project and apply overlay
        run: |
          flutter create --platforms=android --org ir.bimeh --project-name bimeh_web app
          cp overlay/pubspec.yaml app/pubspec.yaml
          rm -rf app/lib && cp -r overlay/lib app/lib
          MAIN=$(find app/android/app/src/main/kotlin -name MainActivity.kt | head -1)
          DIR=$(dirname "$MAIN")
          cp overlay/android/MainActivity.kt "$MAIN"
          cp overlay/android/BimehWebView.kt "$DIR/BimehWebView.kt"
          for f in app/android/app/build.gradle*; do
            if [[ "$f" == *.kts ]]; then
              echo 'dependencies { implementation("androidx.webkit:webkit:1.11.0") }' >> "$f"
            else
              echo "dependencies { implementation 'androidx.webkit:webkit:1.11.0' }" >> "$f"
            fi
          done

      - name: Get packages
        working-directory: app
        run: flutter pub get

      - name: Build debug APK
        working-directory: app
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BimehWebApp-debug
          path: app/build/app/outputs/flutter-apk/app-debug.apk
